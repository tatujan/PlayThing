# PlayThing kernel options (Path A).
# Merge order: superbird_evt_defconfig, then the AOSP Pie fragments
# (kernel/configs p/android-4.9: android-base.cfg, android-base-arm64.cfg), then this file.

# tmpfs. The stock config has SHMEM off, so its "tmpfs" is ramfs ("tiny-shmem").
# android-base.cfg turns SHMEM on, and then TMPFS is a separate option, default off
# (then the stock /tmp mount fails). Android init mounts
# tmpfs on /dev and /mnt, and SELinux labels on tmpfs need TMPFS_XATTR.
# From android-recommended.cfg.
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# Emulated storage (/sdcard): sdcardfs, with FUSE as the fallback.
# From android-recommended.cfg.
CONFIG_SDCARD_FS=y
CONFIG_FUSE_FS=y

# Symbol names in pstore oops logs (debug without UART).
CONFIG_KALLSYMS=y

# The HWC on fbdev (hwcomposer.cpp): every frame goes through the OSD sync-render ioctl
# (FBIOPUT_OSD_SYNC_RENDER_ADD), which needs the OSD fence handlers. The Spotify config has
# them off; then the ioctl returns -EPERM and the panel shows noise.
CONFIG_SW_SYNC=y
CONFIG_AMLOGIC_MEDIA_FB_OSD_SYNC_FENCE=y

# Do not turn on FRAMEBUFFER_CONSOLE: with it, the kernel resets early on the Car Thing,
# also with the stock userspace.

# Android Go uses lmkd in userspace mode. It needs memory cgroups,
# and the in-kernel low-memory killer must be off.
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set

# zram for Android Go.
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y

# DiPlay VpnService (also in android-base.cfg).
CONFIG_TUN=y

# ADB over TCP through the Ethernet port of the host adapter.
CONFIG_USB_USBNET=y
CONFIG_USB_NET_AX88179_178A=y
CONFIG_USB_RTL8152=y
CONFIG_USB_NET_CDCETHER=y
# Off: the kernel cdc_ncm driver binds the iPhone's NCM interface after a reconnect, and
# DiPlay, which runs NCM in user space, then cannot select the NCM data alternate
# setting. The Anker hub Ethernet uses r8152.
# CONFIG_USB_NET_CDC_NCM is not set

# AUX fallback: USB audio adapter.
CONFIG_SND_USB_AUDIO=y

# Recommended by AOSP and cheap.
CONFIG_ARM64_SW_TTBR0_PAN=y

# Hardware video decoder (docs/video.md). The Amlogic media_modules decoders
# (built out of tree, scripts/media-modules.sh) need ionvideo (decoder_common uses
# ionvideo_assign_map) and GE2D (also the 2D engine for a 90-degree rotation).
# AMLOGIC_VIDEOBUF_RESOURCE selects VIDEOBUF2_DMA_CONTIG and V4L2_MEM2MEM_DEV, which
# ionvideo and the V4L2 decoder wrapper (amvdec_ports) need.
CONFIG_AMLOGIC_VIDEOBUF_RESOURCE=y
CONFIG_AMLOGIC_VIDEOBUF2_ION=y
CONFIG_AMLOGIC_IONVIDEO=y
CONFIG_AMLOGIC_MEDIA_GE2D=y
# The V4L2 decoder wrapper (amvdec_ports) needs the multi-instance decoder
# (ammvdec_h264, frame based). Without this option the module tables have only the
# single-instance names, and the V4L2 decoder fails ("amvdec_h264 driver probe
# failed"). Kernel and modules must be built with the same value.
CONFIG_AMLOGIC_MEDIA_MULTI_DEC=y
